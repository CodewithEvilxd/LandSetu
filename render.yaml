services:
  # 1. Python AI Microservice (FastAPI + Uvicorn)
  - type: web
    name: landsetu-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r ai/requirements.txt"
    startCommand: "uvicorn ai.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Node.js Authoritative Backend API (Express + SQLite)
  - type: web
    name: landsetu-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 5000
      - key: AI_SERVICE_URL
        value: https://sih-proto.onrender.com

  # 3. React Frontend (Vite Static Site)
  - type: static
    name: landsetu-frontend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
